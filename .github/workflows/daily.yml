name: 뉴스브리핑 매일 업데이트

on:
  schedule:
    - cron: '23 20 * * *' # 매일 05:23 (한국시간) — GitHub 사정으로 수십 분 늦을 수 있음
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 종류'
        type: choice
        options: [daily, backfill]
        default: daily

concurrency:
  group: newsbrief
  cancel-in-progress: false

jobs:
  # 1) 뉴스 수집·브리핑 생성 → 저장소에 저장 → 웹사이트 파일 묶기
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
      NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      LONG_REFRESH: ${{ vars.LONG_REFRESH || 'daily' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 생성기 설치
        working-directory: generator
        run: |
          npm install --no-audit --no-fund
          # (선택) AI 요약 키가 등록된 경우에만 SDK 설치
          if [ -n "$ANTHROPIC_API_KEY" ]; then npm install --no-audit --no-fund --no-save @anthropic-ai/sdk; fi

      - name: 지난 3년 월간 자료 만들기 (처음 한 번)
        if: github.event.inputs.mode == 'backfill'
        working-directory: generator
        run: npm run backfill

      - name: 오늘의 브리핑 생성
        working-directory: generator
        run: npm run daily

      - name: 결과 저장 (archive, web/data)
        run: |
          git config user.name "newsbrief-bot"
          git config user.email "newsbrief-bot@users.noreply.github.com"
          git add archive web/data
          git commit -m "브리핑 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase || true
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  # 2) 묶은 웹사이트 파일을 GitHub Pages에 배포
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
